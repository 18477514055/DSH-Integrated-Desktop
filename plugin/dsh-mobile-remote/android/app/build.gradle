plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.mobileremote'

    // ★ 本机只装了 android-37.0（实测 `platforms/` 下仅此一个），
    //   所以 compileSdk 必须用 37 —— 写 34 会直接报"platform not found"。
    compileSdk 37

    defaultConfig {
        applicationId "com.dsh.mobileremote"
        minSdk 24            // Android 7.0：覆盖足够老的真机
        targetSdk 37
        versionCode 1
        versionName "0.2.0"
    }

    buildTypes {
        release {
            // ★ 刻意不开混淆：这个壳只有几个类，混淆收益为零，
            //   而一旦 WebView 的 JS 桥被改名，排查起来非常痛苦。
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // 本机 JDK 是 25（Android Studio 自带 JBR），用 17 作目标级别最稳。
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ★ 唯一的第三方依赖（2026-09-22 打破"零依赖"纪录，原因记录在案）：
//   手机 App 要内嵌扫码（用户需求：不用切出去开系统相机）。
//   解码器用 ZXing core（Apache 2.0，纯 Java、无传递依赖）——
//   jar 直接取自本机 Android Studio 安装目录（plugins/android/lib/core-3.5.0.jar）
//   vendor 进 libs/，**不经过任何网络下载**（当晚外网全断，Maven 不可达）。
//   相机预览仍用系统 camera2 手写，不引 androidx/CameraX。
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
