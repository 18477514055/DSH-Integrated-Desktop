# 手机遥控 · Gradle 构建参数
#
# android.overridePathCheck=true 是**必需**的，不是随手加的：
#   本工程真实路径是 D:\deepseek-workspace\5.DSH集成桌面端\... —— 含中文。
#   AGP 默认拒绝含非 ASCII 的工程路径（b.android.com/95744）。
#   ★ 为什么不把目录改成 ASCII：AGENTS.md §0 有实测警告 ——
#     DSH home 里两个已装插件用绝对路径 link: 钉在 5.DSH集成桌面端 上，
#     改目录名 = 当场弄坏这两个插件。所以这里用官方开关绕开。
#   本工程没有 NDK、没有 assets、没有中文文件名，实测可编（见 android/README.md）。
android.overridePathCheck=true

# 编译内存（壳很小，够用）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ── 出口代理（2026-09-21 添加；⚠️ **尚未被证明是必要的**，见下）────────────
#
# 症状（干净缓存下重编时遇到）：
#   Could not resolve com.android.tools.lint:lint-typedef-remover:32.4.1
#   > Could not GET 'https://dl.google.com/...'
#   > The server may not support the client's requested TLS protocol versions: (TLSv1.2, TLSv1.3).
#   > Remote host terminated the handshake
#
# 那个 TLS 报错信息**具有误导性**。实测（2026-09-21）：
#   · PowerShell 直连、走 Clash（127.0.0.1:7897）都是 200；
#   · 用 Android Studio 自带 JBR 写 Java 探针**真实下载 17 MB 的 builder-9.4.1.jar**，
#     开不开代理都是 200、字节数完全一致（17434935）；
#   · curl 直连 / 走代理也都是 200。
#   ⇒ **网络与 TLS 本身没问题**，是 Gradle 侧偶发/并发相关的问题。
#   紧接着关掉 Gradle daemon 再试，就不再报 TLS 而变成普通下载失败；
#   再加 `--offline` 用默认 `~/.gradle` 缓存（09-20 那次成功编译留下的完整缓存）**直接编过**。
#
# ⇒ 结论：**真正让这次编译成功的是"用已填充的默认缓存 + --offline"**，
#   下面这几行代理设置**没有被真正验证过**（那次构建全程离线）。
#   保留它们是因为「JVM 默认不读系统代理」这件事本身成立
#   （与项目 AGENTS.md §6 里 gh / urllib 要显式给代理是同一类坑），
#   在没有代理的机器上它们是无害的空设置。
#   ⚠️ 如果有人要清理，注意：删掉它们**可能**让"全新机器上第一次编译"失败。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
