# 手机遥控 · Gradle 构建参数
#
# android.overridePathCheck=true 是**必需**的，不是随手加的：
#   本工程真实路径是 D:\deepseek-workspace\5.DSH集成桌面端\... —— 含中文。
#   AGP 默认拒绝含非 ASCII 的工程路径（b.android.com/95744）。
#   ★ 为什么不把目录改成 ASCII：AGENTS.md §0 有实测警告 ——
#     DSH home 里两个已装插件用绝对路径 link: 钉在 5.DSH集成桌面端 上，
#     改目录名 = 当场弄坏这两个插件。所以这里用官方开关绕开。
#   本工程没有 NDK、没有 assets、没有中文文件名，实测可编（见 android/README.md）。
android.overridePathCheck=true

# 编译内存（壳很小，够用）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
