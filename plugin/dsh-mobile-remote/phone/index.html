<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!--
  ★ viewport 的两个关键开关：
    · interactive-widget=resizes-content —— 键盘弹出时让**布局视口**跟着缩；
      但 Android 15 起强制 edge-to-edge，部分 ROM 会忽略它 ⇒ 所以
      **不能只靠它**，真正兜底的是 JS 里的 visualViewport（见 app.js 的 syncViewport）。
    · viewport-fit=cover —— 让 env(safe-area-inset-*) 有值，顶部不被刘海、底部不被手势条压住。
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/styles.css" />
<title>dsh手机遥控</title>
</head>
<body>

<!-- ══════════ 宿主版本过旧时的提示（重启客户端即可消失）══════════ -->
<div id="hostBanner" class="banner hidden">
  <span id="hostBannerText"></span>
  <button id="hostBannerClose" class="banner-x" aria-label="关闭">✕</button>
</div>

<!-- ══════════ ① 配对 ══════════ -->
<section id="pairView" class="view">
  <div class="pair-wrap">
    <div class="card">
      <div class="brand">
        <svg class="brand-svg" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="2.5" width="10" height="19" rx="2.4"/>
          <path d="M10.6 5.4h2.8"/>
          <circle cx="12" cy="18.4" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <h1>dsh手机遥控</h1>
      <p class="sub">扫电脑上的二维码即可，或手输 8 位配对码。</p>
      <form id="pairForm" class="pair-form">
        <input id="codeInput" inputmode="latin" autocomplete="off" autocapitalize="characters"
               spellcheck="false" maxlength="8" placeholder="配对码" />
        <button type="submit" class="btn primary">连接</button>
      </form>
      <p id="pairMsg" class="msg"></p>
      <p class="hint">配对码 60 秒内有效、用过即废。<br />连不上时先确认手机与电脑在同一个 Wi-Fi。<br />已配对过但被断开？在电脑上点「换一张码」后<b>手输 8 位码</b>即可，不必扫码。</p>
    </div>
  </div>
</section>

<!-- ══════════ ② 会话列表 ══════════ -->
<section id="listView" class="view hidden">
  <header class="bar">
    <h1 class="bar-title">会话</h1>
    <button id="newSessionBtn" class="icon" title="新建会话" aria-label="新建会话">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
    </button>
    <button id="refreshBtn" class="icon" title="刷新会话列表" aria-label="刷新会话列表">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v5.5h-5.5"/>
      </svg>
    </button>
    <button id="menuBtn" class="icon" title="更多" aria-label="更多">
      <svg class="icon-svg filled" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/>
      </svg>
    </button>
  </header>

  <div class="searchbar">
    <input id="searchInput" class="search" type="search" placeholder="搜标题 / 工作区…" />
  </div>

  <div id="sessionList" class="scroll list"></div>
  <p id="listMsg" class="msg center"></p>
</section>

<!-- ══════════ ③ 会话详情 ══════════ -->
<section id="detailView" class="view hidden">
  <header class="bar">
    <button id="backBtn" class="icon" title="返回会话列表" aria-label="返回会话列表">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5.5L8 12l7 6.5"/></svg>
    </button>
    <div class="titlebox">
      <h1 id="detailTitle">会话</h1>
      <span id="detailSub" class="sub2"></span>
      <!-- 当前模型与推理强度（2026-09-22 用户要求"手机上可以看到当前对话使用的模型和推理强度"）
           放在标题下面一行，与工作区路径同一栏；点它可以打开模型切换抽屉。 -->
      <span id="detailModel" class="model-line"></span>
    </div>
    <button id="modelBtn" class="icon" title="模型与工作区" aria-label="模型与工作区">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7.5h8M17 7.5h3M4 16.5h4M13 16.5h7"/>
        <circle cx="14.5" cy="7.5" r="2.1"/><circle cx="10.5" cy="16.5" r="2.1"/>
      </svg>
    </button>
    <button id="cancelBtn" class="icon danger" title="中断当前任务" aria-label="中断当前任务">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="7" width="10" height="10" rx="2.4" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </header>

  <!-- 审批条：有审批请求时才出现 -->
  <div id="approvalBar" class="approval hidden">
    <div class="approval-text">
      <b id="approvalTool">工具</b>
      <span id="approvalReason"></span>
    </div>
    <div class="approval-actions">
      <button id="approveBtn" class="btn small ok">允许</button>
      <button id="rejectBtn" class="btn small no">拒绝</button>
    </div>
  </div>

  <div id="messages" class="scroll messages"></div>

  <!--
    排队条（2026-09-24 用户需求）：电脑端在"正在思考"时发消息会排队，
    点一下那条待发消息就能"插话"（steer）让它立刻进入当前轮。
    手机上原来没有这个 —— 用户原话：「这条在手机上没有体现」。
    位置与电脑端一致：**输入框上方**（因为它讲的是"还没发出去的下一步"）。
  -->
  <div id="queueBar" class="queuebar hidden"></div>

  <div id="attachBar" class="attachbar hidden"></div>

  <form id="promptForm" class="composer">
    <!--
      输入区按钮（2026-09-22 按用户要求重构）：
      「以后所有的功能全部集中在一个列表中，而不是分成什么图片啊、历史输入啊两个按键，
        这样输入框的位置也宽一点。」
        改之前：[图片][历史] 两个 44px 图标键 + 输入框 ≈245px + 发送 44px；
        改之后：[＋] 一个键 + 输入框 ≈289px + 发送 44px —— 输入框再宽约 18%。
      发图片 / 历史输入收进「＋」弹出的动作列表（app.js 的 openPlusSheet）；
      以后的新能力（文件、模板、语音…）只往那个列表加条目，不再动输入区的布局。
      （历史账：最早的 64px 文字键「发送」曾把输入框挤到只剩 197px ——
        那一轮把发送收成 44px 圆形图标键，这一轮把两个功能键收成一个「＋」。）
    -->
    <button type="button" id="plusBtn" class="icon" title="添加" aria-label="添加：发图片 / 历史输入等">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
    </button>
    <textarea id="promptInput" rows="1" placeholder="发消息…（回车换行）"></textarea>
    <!-- 发送键：44px 圆形图标（纸飞机）。原来是 64px 的文字键「发送」，
         把输入框挤到只剩 197px 宽（实测见 scripts/ui-check-mobile.js 的 ③e 段）。
         去掉文字不影响可用性：它位置固定、右边永远只有这一个动作，
         aria-label 仍写着"发送"。 -->
    <button type="submit" class="btn primary" id="sendBtn" title="发送" aria-label="发送">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.2 11.6L19.4 4.6 12.6 19.8 11.2 13.4z"/>
        <path d="M11.2 13.4l8.2-8.8"/>
      </svg>
    </button>
  </form>
  <input id="fileInput" type="file" accept="image/*" multiple hidden />
  <!-- 文件互传（2026-09-22）：上传用的选择器**不限定类型** —— 用户要传的是
       "电脑那边的项目文件"，zip / 源码 / 视频都可能，不能只收图片。
       与上面 fileInput 分开是刻意的：accept 属性一旦写死就改不了，
       而"发图片给模型看"与"把文件存到电脑"是两件事，混在一个入口会互相干扰。 -->
  <input id="uploadInput" type="file" multiple hidden />
</section>

<!-- ══════════ 抽屉：模型 / 工作区 / 历史 / 菜单 ══════════ -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-mask" data-close="1"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="sheetTitle">标题</h2>
      <button class="icon" data-close="1" aria-label="关闭">
        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="sheetBody" class="scroll sheet-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
