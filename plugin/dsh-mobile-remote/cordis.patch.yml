# dsh-int-mobile-remote 的 bundle 补丁层。
#
# 这一行是**必须**的，不是装饰：把本插件插进 profile 的层栈。
# 实测依据（本机四个第三方插件无一例外都有这个文件；dsh-multi-session 的
# plugin-check 第一次跑就抓到）：
#   光在 package.json 里写 dsh.client **不够** —— 内核在组合 profile 时会直接失败：
#     Error: dsh: profile bundle "dsh-int-mobile-remote" declares no dsh.bundle in its package.json
#   ⇒ 没有这一行，包根本没资格当 bundle，exports["./client"] 也就永远不会被
#     dsh-client-modules 发现并下发。
#
# id 用包名；★ `name` **必须也是包名** —— 它是 loader 用来 `import` 的**模块标识符**，
#   不是给人看的显示名。写成 'Mobile Remote Plugin' 这种显示名会直接炸：
#     Error: failed to import loader entry dsh-int-mobile-remote (Mobile Remote Plugin):
#       Cannot find package 'Mobile Remote Plugin'  [ERR_MODULE_NOT_FOUND]
#   （2026-09-20 实测：整个 profile 起不来、界面退到状态页。对照 dsh-multi-session
#     的写法 `id: dsh-multi-session` / `name: 'dsh-multi-session'`，两边一致。）
#
# ★ 2026-09-22 改名：dsh-mobile-remote → dsh-int-mobile-remote。
#   原因：npm 上 `dsh-mobile-remote` 已被 good-boy4069 占用（0.1.0 / 2026-08-16），
#   dsh-plugin.org 上同名收录 12 个、没有一个是我们的 ⇒ 在公开生态里没有身份。
#   改名要同时动三处，漏一处内核直接起不来：
#     ① 本文件下面的 id 与 name   ② package.json 的 name   ③ profile 的三处契约
- insert:
    - id: dsh-int-mobile-remote
      name: 'dsh-int-mobile-remote'
