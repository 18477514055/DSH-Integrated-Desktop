# ============================================================================
# dsh-int-archive-manager —— DSH bundle patch
# ============================================================================
# ★ 这一行是**必须**的，不是装饰。
#   实测（2026-09-21，`5.DSH集成桌面端\scripts\plugin-check.js` 第一次跑就抓到）：
#   只在 package.json 里写 `dsh.client` **不够** —— 内核组合 profile 时直接失败：
#     Error: dsh: profile bundle "dsh-int-archive-manager" declares no dsh.bundle in its package.json
#   ⇒ 没有这一行，包根本没资格当 bundle，`exports["./client"]` 也永远不会被
#     `dsh-client-modules` 发现并下发，浏览器半边完全没有机会被加载。
#   本机四个第三方插件（dsh-plugin-install / dsh-crosshub / dsh-qoder-connect /
#   dsh-connect-workbuddy）无一例外都有这个文件。
#
# ★ id 用包名（dsh-crosshub 也是这么写的）。
#
# ★ 2026-09-22 改名：dsh-archive-manager → dsh-int-archive-manager。
#   原因：npm 上 `dsh-archive-manager` 已被 jasonrale 占用（1.1.1 / 2026-08-15），
#   dsh-plugin.org 上同名收录 48 个、没有一个是我们的 ⇒ 在公开生态里没有身份。
#   改名要同时动三处，漏一处内核直接起不来：
#     ① 本文件下面的 id 与 name   ② package.json 的 name   ③ profile 的三处契约
# ============================================================================

- insert:
    - id: dsh-int-archive-manager
      name: dsh-int-archive-manager
