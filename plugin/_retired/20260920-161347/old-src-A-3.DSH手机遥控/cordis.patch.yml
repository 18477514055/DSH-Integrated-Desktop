# dsh-mobile-remote 的 bundle 补丁层。
#
# 这一行是**必须**的，不是装饰：把本插件插进 profile 的层栈。
# 参考本机已有插件（dsh-plugin-install, dsh-crosshub, dsh-multi-session）:
#   光在 package.json 里写 dsh.client **不够** —— 内核在组合 profile 时会直接失败：
#     Error: dsh: profile bundle "xxx" declares no dsh.bundle in its package.json
#   ⇒ 没有这一行，包根本没资格当 bundle。
#
# id 用包名（与官方第三方插件一致写法）。

- insert:
    - id: dsh-mobile-remote
      name: 'Mobile Remote Plugin'
