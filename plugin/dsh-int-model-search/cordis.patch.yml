# dsh-int-model-search 的 bundle 补丁层。
#
# 这一行是**必须**的，不是装饰：把本插件插进 profile 的层栈。
# 实测（2026-09-21，plugin-check 第一次跑就抓到）：
#   光在 package.json 里写 dsh.client **不够** —— 内核在组合 profile 时会直接失败：
#     Error: dsh: profile bundle "…" declares no dsh.bundle in its package.json
#   ⇒ 没有这一行，包根本没资格当 bundle，exports["./client"] 也就永远不会被
#      dsh-client-modules 发现并下发。
#
# id 用包名（与本仓库其它插件一致）。
- insert:
    - id: dsh-int-model-search
      name: dsh-int-model-search
