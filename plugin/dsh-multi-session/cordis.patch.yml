# dsh-multi-session 的 bundle 补丁层。
#
# 这一行是**必须**的，不是装饰：把本插件插进 profile 的层栈。
# 实测（2026-09-21，scripts/plugin-check.js 第一次跑就抓到）：
#   光在 package.json 里写 dsh.client **不够** —— 内核在组合 profile 时会直接失败：
#     Error: dsh: profile bundle "dsh-multi-session" declares no dsh.bundle in its package.json
#   ⇒ 没有这一行，包根本没资格当 bundle，exports["./client"] 也就永远不会被
#      dsh-client-modules 发现并下发。本机四个第三方插件（dsh-plugin-install /
#      dsh-crosshub / dsh-qoder-connect / dsh-connect-workbuddy）无一例外都有这个文件。
#
# id 用包名（dsh-crosshub 也是这么写的）；qoder 用 llm-qoder 是因为它要占一个 provider id。
- insert:
    - id: '@zjh18477514055/dsh-multi-session'
      name: '@zjh18477514055/dsh-multi-session'
