<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH 集成桌面端</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
<link rel="stylesheet" href="shell-ui.css">
<style>
  /* ── 加载页专有布局 ───────────────────────────────────────────── */
  .stage {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 24px 84px; text-align: center; overflow: auto;
  }
  .whale { width: min(30vh, 240px); height: min(30vh, 240px); flex: none; }

  .title { font-size: 19px; font-weight: 600; margin: 22px 0 0; letter-spacing: .3px; }
  .stagetext { color: var(--fg-dim); font-size: 13px; margin-top: 7px; min-height: 21px; }

  .barwrap { width: min(360px, 76vw); margin-top: 18px; }
  .bar {
    position: relative; height: 6px; border-radius: 999px;
    background: #eceff3; overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, #4d6bfe, #7aa0ff);
    box-shadow: 0 0 12px rgba(77, 107, 254, .40);
    transition: width .35s cubic-bezier(.22, .61, .36, 1);
    position: relative;
  }
  /* 里程碑之间只有这个流光在动 —— 进度条不会自己乱爬（不谎报进度） */
  .bar-fill::after {
    content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .8), transparent);
    animation: sweep 1.5s ease-in-out infinite;
  }
  .bar.idle .bar-fill::after { animation: none; }
  @keyframes sweep { 0% { left: -40%; } 100% { left: 100%; } }
  .barmeta { color: var(--fg-faint); font-size: 12px; margin-top: 7px; min-height: 18px; }

  /* 阶段清单：真实的进度来源，只有它推进进度条 */
  .stages {
    list-style: none; margin: 20px 0 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center;
    max-width: 640px;
  }
  .stages li { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-faint); }
  .stages li .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #d8dce0; flex: none;
  }
  .stages li.active { color: var(--accent); font-weight: 600; }
  .stages li.active .dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(77, 107, 254, .16); }
  .stages li.done { color: var(--fg-dim); }
  .stages li.done .dot { background: var(--ok); }
  .stages li.fail { color: var(--err); font-weight: 600; }
  .stages li.fail .dot { background: var(--err); }

  .detail {
    margin: 18px 0 0; padding: 12px 14px; text-align: left;
    width: min(760px, 92vw); max-height: 30vh; overflow: auto;
    background: #fbfbfc; border: 1px solid var(--line); border-radius: 10px;
    font-size: 12px; color: #3d444d; white-space: pre-wrap; word-break: break-word;
  }
  .verdict { margin-top: 16px; width: min(560px, 90vw); text-align: left; }

  /* ── 底部按钮 ─────────────────────────────────────────────────── */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; gap: 8px; justify-content: center; align-items: center;
    padding: 12px 16px 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0), #fff 42%);
  }

  /* ── 上拉抽屉 ─────────────────────────────────────────────────── */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(16, 20, 26, .28);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 900;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 901;
    height: min(74vh, 620px);
    background: #fff; border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -12px 36px rgba(16, 20, 26, .16);
    transform: translateY(101%); transition: transform .26s cubic-bezier(.22, .61, .36, 1);
    display: flex; flex-direction: column;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid var(--line); flex: none;
  }
  .sheet-head .h { font-weight: 600; }
  .sheet-head .sub { color: var(--fg-faint); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .sheet-body {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(280px, 380px) 1fr; gap: 14px; padding: 14px 18px 18px;
  }
  @media (max-width: 820px) { .sheet-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
  .sheet-col { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .grab { width: 40px; height: 4px; border-radius: 999px; background: #dfe3e8; margin: 8px auto 0; flex: none; }
</style>
</head>
<body>

<main class="stage">
  <svg class="whale" viewBox="0 0 50 50" aria-hidden="true">
    <rect class="w-bg" x="0" y="0" width="50" height="50"></rect>
    <g class="w-g">
      <path class="w-body"></path>
      <path class="w-belly"></path>
      <path class="w-eye"></path>
      <path class="w-spout"></path>
    </g>
  </svg>

  <h1 class="title" id="title">正在启动…</h1>
  <div class="stagetext" id="stagetext"></div>

  <div class="barwrap">
    <div class="bar" id="bar"><div class="bar-fill" id="barfill"></div></div>
    <div class="barmeta" id="barmeta"></div>
  </div>

  <ol class="stages" id="stages"></ol>

  <pre class="detail" id="detail" hidden></pre>
  <div class="verdict" id="verdict"></div>
</main>

<div class="bottom">
  <button class="btn" id="btn-diag">诊断与修复</button>
  <button class="btn" id="btn-settings">设置</button>
</div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<section class="sheet" id="sheet" aria-label="诊断与修复">
  <div class="grab"></div>
  <header class="sheet-head">
    <div>
      <span class="h">诊断与修复</span>
      <span class="sub">出问题时先点「环境体检」；要停掉当前回答的按钮会先弹确认</span>
    </div>
    <button class="btn" id="btn-close">关闭</button>
  </header>
  <div class="sheet-body">
    <div class="sheet-col">
      <div class="verdict" id="verdict2"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="sheet-col">
      <div class="output" id="outwrap" style="flex:1">
        <div class="output-head"><span>输出</span><button class="btn" id="btn-clear">清空</button></div>
        <pre id="out"></pre>
      </div>
    </div>
  </div>
</section>

<script src="shell-ui.js"></script>
<script src="status-page.js"></script>
</body>
</html>
